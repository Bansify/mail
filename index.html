<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bansify Mail — India's Email System</title>
    <meta
      name="description"
      content="Bansify Mail is the inbox for your @bansify.com address: fast webmail on desktop and mobile. Read, compose and search your mail in the browser, signed in with your Bansify Account."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://mail.bansify.com/" />

    <meta property="og:site_name" content="Bansify Mail" />
    <meta property="og:title" content="Bansify Mail — India's Email System" />
    <meta
      property="og:description"
      content="The inbox for your @bansify.com address. Fast webmail on desktop and mobile, signed in with your Bansify Account."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mail.bansify.com/" />
    <meta property="og:image" content="https://mail.bansify.com/icon-512.png" />
    <meta property="og:image:alt" content="Bansify Mail" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bansify Mail — India's Email System" />
    <meta
      name="twitter:description"
      content="The inbox for your @bansify.com address. Fast webmail on desktop and mobile, signed in with your Bansify Account."
    />
    <meta name="twitter:image" content="https://mail.bansify.com/icon-512.png" />

    <meta name="application-name" content="Bansify Mail" />
    <meta name="theme-color" content="#0494f4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BansifyMail" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font: the inbox paints with the system font first, then
         swaps in Plus Jakarta Sans. Saves ~300-600ms on a slow mobile network. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!--
      The site name a search engine shows comes from this graph, not from the tab title.
      Without it Google falls back to the apex domain (bansify.com) and the Accounts
      sign-in page, which is why the result read "bansify.com / Sign in — Bansify Accounts".
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://mail.bansify.com/#website",
            "url": "https://mail.bansify.com/",
            "name": "Bansify Mail",
            "alternateName": "Bansify Mail — India's Email System",
            "description": "The inbox for your @bansify.com address. Fast webmail on desktop and mobile.",
            "inLanguage": "en-IN",
            "publisher": { "@id": "https://www.bansify.com/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://www.bansify.com/#organization",
            "name": "Bansify",
            "url": "https://www.bansify.com",
            "logo": "https://www.bansify.com/assets/brand/logo.png",
            "sameAs": "https://github.com/Bansify"
          },
          {
            "@type": "WebApplication",
            "name": "Bansify Mail",
            "url": "https://mail.bansify.com/",
            "applicationCategory": "CommunicationApplication",
            "operatingSystem": "Web",
            "browserRequirements": "Requires JavaScript",
            "isPartOf": { "@id": "https://mail.bansify.com/#website" },
            "publisher": { "@id": "https://www.bansify.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body class="overflow-hidden antialiased">
    <!--
      Crawlable fallback. React replaces this on mount, but a crawler that does not run
      the app still sees the product name, one description and the four destinations —
      which is what lets a search result show the site's own name and its shortcuts.
    -->
    <div id="root">
      <div
        style="
          font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          max-width: 40rem;
          margin: 4rem auto;
          padding: 0 1.25rem;
          line-height: 1.6;
        "
      >
        <h1 style="font-size: 1.5rem; margin: 0 0 0.5rem">Bansify Mail</h1>
        <p style="margin: 0 0 1rem; color: #5f6368">
          The inbox for your @bansify.com address. Fast webmail on desktop and mobile, signed
          in with your Bansify Account.
        </p>
        <nav aria-label="Bansify Mail">
          <ul style="list-style: none; padding: 0; margin: 0; display: grid; gap: 0.5rem">
            <li><a href="https://accounts.bansify.com/login">Sign in with Bansify Accounts</a></li>
            <li><a href="/#inbox">Inbox</a></li>
            <li><a href="/?compose=1#inbox">Compose a message</a></li>
            <li><a href="https://bansify.com">Bansify — the rest of the ecosystem</a></li>
          </ul>
        </nav>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
